replicaCount: 3

image:
  repository: leattrace/backend
  pullPolicy: IfNotPresent
  tag: "2.0.0"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: portal.leattrace.gov.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: leattrace-tls-cert
      hosts:
        - portal.leattrace.gov.in

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  ENVIRONMENT: production
  LOG_LEVEL: info
  WORKERS: 4

probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
